name: Build NetHunter Kernel - SM-A225F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            git zip unzip cpio lz4 xz-utils python3 python-is-python3 \
            libncurses5-dev libncursesw5-dev device-tree-compiler \
            crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Fetch Samsung Kernel Source
        run: |
          git clone --depth=1 https://github.com/karamdev1/nethunter_kernel_samsung_mt6768.git kernel_source

      - name: Fix Missing KernelSU Directory
        run: |
          cd kernel_source
          rm -rf drivers/kernelsu
          mkdir -p drivers/kernelsu
          echo 'config KERNELSU' > drivers/kernelsu/Kconfig
          echo '	tristate "KernelSU support"' >> drivers/kernelsu/Kconfig
          echo '	default n' >> drivers/kernelsu/Kconfig
          echo 'obj-y += kernelsu/' > drivers/kernelsu/Makefile

      - name: Find and Prepare Defconfig
        run: |
          cd kernel_source
          
          CONFIG_FILE=$(find arch/arm64/configs/ -type f \( -name "*a22*" -o -name "*mt6768*" -o -name "*defconfig*" \) | head -n 1)
          CONFIG_NAME=$(basename "$CONFIG_FILE")
          
          echo "FOUND_DEFCONFIG=$CONFIG_NAME" >> $GITHUB_ENV
          
          if [ -n "$CONFIG_FILE" ]; then
            echo "# Kali NetHunter Additions" >> "$CONFIG_FILE"
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> "$CONFIG_FILE"
            echo "CONFIG_USB_G_HID=y" >> "$CONFIG_FILE"
            echo "CONFIG_CFG80211=y" >> "$CONFIG_FILE"
            echo "CONFIG_MAC80211=y" >> "$CONFIG_FILE"
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64

          # Load defconfig
          make ARCH=arm64 O=out $FOUND_DEFCONFIG

          # Compile Kernel using GCC to prevent MediaTek driver Clang failures
          make -j$(nproc --all) ARCH=arm64 O=out \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            KCFLAGS="-w" \
            KCPPFLAGS="-w"

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          
          find ../kernel_source/out/arch/arm64/boot/ -name "Image*" -exec cp {} ./ \;
          
          zip -r9 ../NetHunter-Kernel-A225F.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-A225F
          path: NetHunter-Kernel-A225F.zip
