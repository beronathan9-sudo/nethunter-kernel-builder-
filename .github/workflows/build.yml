name: Build NetHunter Kernel - SM-A225F

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex libssl-dev libelf-dev \
            git zip unzip cpio lz4 xz-utils python3 python-is-python3 \
            libncurses5-dev libncursesw5-dev device-tree-compiler \
            crossbuild-essential-arm64 crossbuild-essential-armhf

      - name: Setup Toolchain (Proton Clang)
        run: |
          mkdir -p toolchain
          cd toolchain
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang

      - name: Fetch Samsung Kernel Source
        run: |
          git clone --depth=1 https://github.com/karamdev1/nethunter_kernel_samsung_mt6768.git kernel_source

      - name: Patch Missing KernelSU Directory
        run: |
          cd kernel_source
          mkdir -p drivers/kernelsu || true
          if [ ! -f "drivers/kernelsu/Kconfig" ]; then
            echo '# Dummy Kconfig for KernelSU' > drivers/kernelsu/Kconfig
          fi

      - name: Inject NetHunter Defconfig Options
        run: |
          cd kernel_source
          DEFCONFIG="arch/arm64/configs/a22_defconfig"
          
          if [ -f "$DEFCONFIG" ]; then
            echo "# Kali NetHunter Additions" >> $DEFCONFIG
            echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $DEFCONFIG
            echo "CONFIG_USB_G_HID=y" >> $DEFCONFIG
            echo "CONFIG_CFG80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211=y" >> $DEFCONFIG
            echo "CONFIG_MAC80211_RC_DEFAULT=\"minstrel_ht\"" >> $DEFCONFIG
          fi

      - name: Compile Kernel
        run: |
          cd kernel_source
          export ARCH=arm64
          export SUBARCH=arm64
          export PATH=$(pwd)/../toolchain/clang/bin:$PATH

          # Build defconfig
          make ARCH=arm64 O=out a22_defconfig

          # Compile Kernel Image
          make -j$(nproc --all) ARCH=arm64 O=out \
            CC=clang \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            NM=llvm-nm \
            OBJCOPY=llvm-objcopy \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip

      - name: Package with AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cd AnyKernel3
          if [ -f ../kernel_source/out/arch/arm64/boot/Image.gz-dtb ]; then
            cp ../kernel_source/out/arch/arm64/boot/Image.gz-dtb ./Image.gz-dtb
          elif [ -f ../kernel_source/out/arch/arm64/boot/Image.gz ]; then
            cp ../kernel_source/out/arch/arm64/boot/Image.gz ./Image.gz
          elif [ -f ../kernel_source/out/arch/arm64/boot/Image ]; then
            cp ../kernel_source/out/arch/arm64/boot/Image ./Image
          fi
          
          zip -r9 ../NetHunter-Kernel-A225F.zip * -x .git README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetHunter-Kernel-A225F
          path: NetHunter-Kernel-A225F.zip
